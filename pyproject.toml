[project]
name = "autotom-digital-twin"
version = "0.1.0"
description = "Turn a tomato plant skeleton into an articulated OpenUSD plant for NVIDIA Isaac Sim"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.0",
    "pandas>=3.0.3",  # only the CSV fixture builder of the joint-optimizer tests
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "types-usd>=24.5.2",
    "usd-core>=26.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exporterV2", "src/plant_skeleton"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running integration coverage",
]
